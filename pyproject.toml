[project]
name = "ortam"
version = "0.0.1"
description = "ORTAM — Open Risk, Transport And Modelling: a modular environmental modelling, site characterization and risk assessment platform"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "pint",
    "pydantic>=2",
    "pyyaml",
    "openpyxl>=3.1.5",
    "access-parser>=0.0.6",
]

[project.scripts]
ortam = "ortam_core.cli:main"

# A build system makes uv install the project itself (editable), so that the
# `ortam` command above exists. Without it uv treats the folder as a plain
# collection of scripts and `uv run ortam` fails with "Failed to spawn: ortam".
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ortam_core", "modules", "workflows"]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["ortam_core/tests", "modules", "workflows"]
pythonpath = ["."]
